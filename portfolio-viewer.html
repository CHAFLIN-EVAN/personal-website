  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #e5e5e5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    .thumb {
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .thumb:hover { border-color: #39ff14; transform: translateY(-2px); }
    .thumb.active { border-color: #39ff14; box-shadow: 0 0 12px rgba(57,255,20,0.3); }

    .nav-btn {
      transition: all 0.3s ease;
    }
    .nav-btn:hover { background: rgba(57,255,20,0.15); color: #39ff14; }

    .zoom-btn {
      transition: all 0.3s ease;
    }
    .zoom-btn:hover { background: rgba(57,255,20,0.15); color: #39ff14; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.25s ease; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .loading-text { animation: pulseGlow 1.5s ease-in-out infinite; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #loading-overlay.hidden { opacity: 0; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #39ff14;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #viewer-container {
      cursor: grab;
      overflow: hidden;
    }
    #viewer-container.grabbing { cursor: grabbing; }
    #viewer-container.zoomed-out { cursor: default; }

    #main-image {
      transform-origin: 0 0;
      transition: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Right TOC Sidebar */
    #sidebar {
      position: fixed;
      top: 3.5rem;
      right: 0;
      height: calc(100vh - 3.5rem);
      z-index: 45;
      transform: translateX(320px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-panel {
      width: 320px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    #sidebar-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #e5e5e5;
      letter-spacing: 0.5px;
    }
    #sidebar-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 12px;
    }
    #sidebar-close:hover {
      background: rgba(57, 255, 20, 0.1);
      border-color: rgba(57, 255, 20, 0.25);
      color: #39ff14;
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      scroll-behavior: smooth;
    }
    #sidebar-list::-webkit-scrollbar {
      width: 3px;
    }
    #sidebar-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #sidebar-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }
    #sidebar-list::-webkit-scrollbar-thumb:hover {
      background: rgba(57, 255, 20, 0.25);
    }

    .sidebar-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
    }
    .sidebar-item.active {
      background: rgba(57, 255, 20, 0.05);
      border-color: rgba(57, 255, 20, 0.2);
    }

    .sidebar-num {
      width: 26px;
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      transition: all 0.2s ease;
    }
    .sidebar-item.active .sidebar-num,
    .sidebar-item:hover .sidebar-num {
      background: rgba(57, 255, 20, 0.15);
      color: #39ff14;
    }

    .sidebar-text {
      flex: 1;
      min-width: 0;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 500;
      color: #c5c5c5;
      line-height: 1.4;
      transition: color 0.2s ease;
    }
    .sidebar-item.active .sidebar-title,
    .sidebar-item:hover .sidebar-title {
      color: #e5e5e5;
    }
    .sidebar-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 1px;
      line-height: 1.3;
      transition: color 0.2s ease;
    }
    .sidebar-item.active .sidebar-sub {
      color: rgba(57, 255, 20, 0.45);
    }

    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 44;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #sidebar-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 1024px) {
      #sidebar.open ~ main {
        margin-right: 320px;
      }
    }

    /* Left Detail Floating Ball */
    #detail-ball {
      position: fixed;
      left: -28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 55;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.3s ease,
                  border-color 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      user-select: none;
      -webkit-user-drag: none;
    }
    #detail-ball:hover,
    #detail-ball.hover-in {
      left: 8px;
      border-color: rgba(57, 255, 20, 0.35);
      box-shadow: 0 0 28px rgba(57, 255, 20, 0.1);
    }
    #detail-ball.dragging {
      cursor: grabbing;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.9;
    }
    #detail-ball i {
      color: rgba(255, 255, 255, 0.6);
      font-size: 17px;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    #detail-ball:hover i,
    #detail-ball.hover-in i {
      color: #39ff14;
    }
    #detail-ball .ball-page {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 9px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    #detail-ball:hover .ball-page,
    #detail-ball.hover-in .ball-page {
      border-color: rgba(57, 255, 20, 0.4);
      color: #39ff14;
    }

    /* Detail Card */
    #detail-card {
      position: fixed;
      left: 18px;
      top: 50%;
      transform: translateY(-50%) scale(0.85);
      z-index: 54;
      width: 280px;
      max-height: 420px;
      background: rgba(14, 14, 14, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease,
                  transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }
    #detail-card.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1);
    }
    #detail-card.hidden-card {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(0.85);
    }

    #detail-card-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #detail-card-header .page-badge {
      font-size: 11px;
      font-weight: 600;
      color: #39ff14;
      background: rgba(57, 255, 20, 0.08);
      padding: 3px 10px;
      border-radius: 20px;
    }
    #detail-card-close {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 10px;
    }
    #detail-card-close:hover {
      background: rgba(57, 255, 20, 0.1);
      border-color: rgba(57, 255, 20, 0.3);
      color: #39ff14;
    }

    #detail-card-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }
    #detail-card-body::-webkit-scrollbar {
      width: 2px;
    }
    #detail-card-body::-webkit-scrollbar-track {
      background: transparent;
    }
    #detail-card-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
    }
    #detail-card-body h4 {
      font-size: 14px;
      font-weight: 600;
      color: #e5e5e5;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    #detail-card-body .detail-divider {
      width: 32px;
      height: 2px;
      background: #39ff14;
      opacity: 0.4;
      border-radius: 1px;
      margin-bottom: 10px;
    }
    #detail-card-body p {
      font-size: 12px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.5);
    }
    #detail-card-body .detail-label {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: rgba(57, 255, 20, 0.55);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
      margin-bottom: 2px;
    }

    #detail-card-none {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.25);
    }
    #detail-card-none i {
      font-size: 28px;
      margin-bottom: 10px;
      opacity: 0.3;
    }
    #detail-card-none p {
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

    // Build sidebar list
    const sidebarList = document.getElementById('sidebar-list');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    let sidebarOpen = false;

    function buildSidebar() {
      sidebarList.innerHTML = '';
      pageInfo.forEach((info, i) => {
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (i === current ? ' active' : '');
        item.setAttribute('data-page', i);
        item.onclick = () => { goTo(i); if (window.innerWidth < 1024) closeSidebar(); };
        item.innerHTML = `
          <div class="sidebar-num">${i + 1}</div>
          <div class="sidebar-text">
            <div class="sidebar-title">${info.title}</div>
            <div class="sidebar-sub">${info.sub}</div>
          </div>
        `;
        sidebarList.appendChild(item);
      });
    }

    function openSidebar() {
      sidebar.classList.add('open');
      if (window.innerWidth < 1024) sidebarOverlay.classList.add('visible');
      sidebarOpen = true;
      scrollSidebarToCurrent();
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('visible');
      sidebarOpen = false;
    }

    function toggleSidebar() {
      sidebarOpen ? closeSidebar() : openSidebar();
    }

    function syncSidebarActive() {
      document.querySelectorAll('.sidebar-item').forEach((item, i) => {
        item.classList.toggle('active', i === current);
      });
      scrollSidebarToCurrent();
    }

    function scrollSidebarToCurrent() {
      const active = sidebarList.querySelector('.sidebar-item.active');
      if (active) {
        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Keyboard shortcut: S to toggle sidebar
    document.addEventListener('keydown', e => {
      if (e.key === 's' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement === document.body) {
        toggleSidebar();
      }
    });

    buildSidebar();

    // Detail ball & card
    const detailBall = document.getElementById('detail-ball');
    const detailCard = document.getElementById('detail-card');
    const detailCardBody = document.getElementById('detail-card-body');
    const detailBadge = document.getElementById('detail-badge');
    const ballPageNum = document.getElementById('ball-page-num');
    let detailCardOpen = false;

    // Ball drag
    let isDraggingBall = false;
    let ballDragStartY = 0;
    let ballStartTop = 0;
    let hasMoved = false;

    detailBall.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      isDraggingBall = true;
      hasMoved = false;
      detailBall.classList.add('dragging');
      ballDragStartY = e.clientY;
      ballStartTop = detailBall.getBoundingClientRect().top;
      e.preventDefault();
    });

    window.addEventListener('mousemove', e => {
      if (!isDraggingBall) return;
      const dy = e.clientY - ballDragStartY;
      if (Math.abs(dy) > 3) hasMoved = true;
      let newTop = ballStartTop + dy;
      // Clamp within viewport
      const minY = 80;
      const maxY = window.innerHeight - 120;
      newTop = Math.max(minY, Math.min(maxY, newTop));
      detailBall.style.top = newTop + 'px';
      detailBall.style.transform = 'translateY(0)';
      // Also move the card
      detailCard.style.top = newTop + 'px';
      detailCard.style.transform = detailCardOpen ? 'translateY(0) scale(1)' : 'translateY(0) scale(0.85)';
    });

    window.addEventListener('mouseup', () => {
      if (isDraggingBall) {
        detailBall.classList.remove('dragging');
        isDraggingBall = false;
        // Auto-snap: hide part of ball off-screen after drag
        setTimeout(() => {
          if (!isDraggingBall && !detailBall.matches(':hover')) {
            detailBall.style.left = '-28px';
            detailBall.classList.remove('hover-in');
          }
        }, 1200);
      }
    });

    // Touch drag
    detailBall.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDraggingBall = true;
        hasMoved = false;
        detailBall.classList.add('dragging');
        ballDragStartY = e.touches[0].clientY;
        ballStartTop = detailBall.getBoundingClientRect().top;
      }
    });

    window.addEventListener('touchmove', e => {
      if (!isDraggingBall) return;
      const dy = e.touches[0].clientY - ballDragStartY;
      if (Math.abs(dy) > 3) hasMoved = true;
      let newTop = ballStartTop + dy;
      const minY = 80;
      const maxY = window.innerHeight - 120;
      newTop = Math.max(minY, Math.min(maxY, newTop));
      detailBall.style.top = newTop + 'px';
      detailBall.style.transform = 'translateY(0)';
      detailCard.style.top = newTop + 'px';
      detailCard.style.transform = detailCardOpen ? 'translateY(0) scale(1)' : 'translateY(0) scale(0.85)';
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (isDraggingBall) {
        detailBall.classList.remove('dragging');
        isDraggingBall = false;
        setTimeout(() => {
          if (!isDraggingBall) {
            detailBall.style.left = '-28px';
            detailBall.classList.remove('hover-in');
          }
        }, 1200);
      }
    });

    // Ball hover behavior
    detailBall.addEventListener('mouseenter', () => {
      if (!isDraggingBall) {
        detailBall.classList.add('hover-in');
      }
    });
    detailBall.addEventListener('mouseleave', () => {
      if (!isDraggingBall && !detailCardOpen) {
        detailBall.classList.remove('hover-in');
        detailBall.style.left = '-28px';
      }
    });

    function toggleDetailCard() {
      if (detailCardOpen) {
        closeDetailCard();
      } else {
        openDetailCard();
      }
    }

    function openDetailCard() {
      detailCardOpen = true;
      detailCard.classList.add('open');
      detailCard.classList.remove('hidden-card');
      detailBall.style.left = '8px';
      detailBall.classList.add('hover-in');
      updateDetailCardContent();
    }

    function closeDetailCard() {
      detailCardOpen = false;
      detailCard.classList.remove('open');
      detailCard.classList.add('hidden-card');
      setTimeout(() => {
        detailBall.style.left = '-28px';
        detailBall.classList.remove('hover-in');
      }, 200);
    }

    function updateDetailCardContent() {
      const info = pageDetails[current];
      const ballNum = document.getElementById('ball-page-num');
      ballNum.textContent = current + 1;
      detailBadge.textContent = '第 ' + (current + 1) + ' 页';

      if (!info) {
        detailCardBody.innerHTML = `
          <div id="detail-card-none">
            <i class="fa-solid fa-circle-exclamation"></i>
            <p>本页暂无详细说明<br>（封面、简历、目录与封底不展示详情）</p>
          </div>
        `;
      } else {
        detailCardBody.innerHTML = `
          <h4>${info.title}</h4>
          <div class="detail-divider"></div>
          <p>${info.context}</p>
          <div class="detail-label">具体内容</div>
          <p>${info.content}</p>
          <div class="detail-label">设计要点</div>
          <p>${info.highlights}</p>
        `;
      }
    }

    // Also override toggleDetailCard on the ball to respect click vs drag
    detailBall.addEventListener('click', e => {
      if (!hasMoved) {
        toggleDetailCard();
      }
    });
    const preloaded = new Set([0]);

    // Zoom state
    let zoom = 1;
    const MIN_ZOOM = 0.3;
    const MAX_ZOOM = 5;
    const ZOOM_STEP = 0.15;
    let panX = 0, panY = 0;

    // Pan state
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let panStartX = 0, panStartY = 0;

    const container = document.getElementById('viewer-container');
    const img = document.getElementById('main-image');

    function clampZoom(z) { return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z)); }

    function applyTransform() {
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      container.classList.toggle('zoomed-out', zoom <= 1);
    }

    function updateZoomUI() {
      document.getElementById('zoom-indicator').textContent = Math.round(zoom * 100) + '%';
    }

    function resetZoom() {
      zoom = 1;
      panX = 0; panY = 0;
      applyTransform();
      updateZoomUI();
    }

    function zoomIn() {
      zoomAtPoint(zoom + ZOOM_STEP, container.clientWidth / 2, container.clientHeight / 2);
    }

    function zoomOut() {
      zoomAtPoint(zoom - ZOOM_STEP, container.clientWidth / 2, container.clientHeight / 2);
    }

    function zoomAtPoint(newZoom, cx, cy) {
      const oldZoom = zoom;
      newZoom = clampZoom(newZoom);
      if (newZoom === oldZoom) return;

      // Zoom toward cursor position
      const ratio = newZoom / oldZoom;
      panX = cx - ratio * (cx - panX);
      panY = cy - ratio * (cy - panY);
      zoom = newZoom;
      applyTransform();
      updateZoomUI();
    }

    // Mouse wheel zoom
    container.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) return; // browser zoom
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
      zoomAtPoint(zoom + delta, cx, cy);
    }, { passive: false });

    // Pan with drag
    container.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      isDragging = true;
      container.classList.add('grabbing');
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      panStartX = panX;
      panStartY = panY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = panStartX + (e.clientX - dragStartX);
      panY = panStartY + (e.clientY - dragStartY);
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      container.classList.remove('grabbing');
    });

    // Double-click to reset zoom
    container.addEventListener('dblclick', e => {
      e.preventDefault();
      resetZoom();
    });

    // Touch pinch zoom
    let lastPinchDist = 0;
    let pinchZoomStart = 1;
    let pinchPanX = 0, pinchPanY = 0;

    container.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchZoomStart = zoom;
        pinchPanX = panX;
        pinchPanY = panY;
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - container.getBoundingClientRect().left;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - container.getBoundingClientRect().top;
        container.setAttribute('data-pinch-cx', cx);
        container.setAttribute('data-pinch-cy', cy);
      }
    });

    container.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = dist / lastPinchDist;
        const newZoom = clampZoom(pinchZoomStart * scale);
        const cx = parseFloat(container.getAttribute('data-pinch-cx')) || container.clientWidth / 2;
        const cy = parseFloat(container.getAttribute('data-pinch-cy')) || container.clientHeight / 2;
        const ratio = newZoom / zoom;
        panX = cx - ratio * (cx - panX);
        panY = cy - ratio * (cy - panY);
        zoom = newZoom;
        applyTransform();
        updateZoomUI();
      }
    }, { passive: false });

    // Navigation
    function preload(i) {
      if (i < 0 || i >= TOTAL || preloaded.has(i)) return;
      preloaded.add(i);
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = `portfolio-images/${i + 1}.webp`;
      document.head.appendChild(link);
    }

    function navigate(dir) {
      const next = (current + dir + TOTAL) % TOTAL;
      goTo(next);
      preload(next + dir);
    }

    const loadingOverlay = document.getElementById('loading-overlay');
    let loadTimeout;

    function showLoading() {
      clearTimeout(loadTimeout);
      loadTimeout = setTimeout(() => {
        loadingOverlay.classList.remove('hidden');
      }, 200);
    }

    function hideLoading() {
      clearTimeout(loadTimeout);
      loadingOverlay.classList.add('hidden');
    }

    function goTo(n) {
      current = n;
      resetZoom();
      showLoading();
      img.classList.remove('fade-in');
      void img.offsetWidth;
      img.src = `portfolio-images/${n + 1}.webp`;
      document.getElementById('page-indicator').textContent = `${n + 1} / ${TOTAL}`;
      updateThumbs();
      syncSidebarActive();
      updateDetailCardContent();
      document.getElementById('ball-page-num').textContent = n + 1;
      preload(n - 1);
      preload(n + 1);
    }

    img.addEventListener('load', () => {
      hideLoading();
      img.classList.add('fade-in');
    });

    img.addEventListener('error', () => {
      hideLoading();
      loadingOverlay.innerHTML = '<p class=\"loading-text text-red-400 text-sm\">加载失败，请重试</p>';
      loadingOverlay.classList.remove('hidden');
    });

    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === current);
        if (i === current) {
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
    }

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'Escape') {
        if (detailCardOpen) { closeDetailCard(); return; }
        if (sidebarOpen) { closeSidebar(); return; }
        resetZoom();
      }
    });

    // Touch swipe (single finger for page turn)
    let touchStartX = 0;
    container.addEventListener('touchstart', e => {
      if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    });
    container.addEventListener('touchend', e => {
      if (e.touches.length === 0) {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 60 && zoom <= 1) navigate(diff > 0 ? 1 : -1);
      }
    });

    // Build thumbnails
    const strip = document.getElementById('thumbnail-strip');
    for (let i = 0; i < TOTAL; i++) {
      const img = document.createElement('img');
      img.src = `portfolio-images/thumb-${i + 1}.webp`;
      img.loading = 'lazy';
      img.className = `thumb w-12 h-16 object-cover rounded cursor-pointer flex-shrink-0 ${i === 0 ? 'active' : ''}`;
      img.onclick = () => goTo(i);
      strip.appendChild(img);
    }
  </script>
</body>
</html>
