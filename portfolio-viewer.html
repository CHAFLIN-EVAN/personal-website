<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 — 彭一泓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preload" as="image" href="portfolio-images/1.webp">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #e5e5e5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    .thumb {
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .thumb:hover { border-color: #39ff14; transform: translateY(-2px); }
    .thumb.active { border-color: #39ff14; box-shadow: 0 0 12px rgba(57,255,20,0.3); }

    .nav-btn {
      transition: all 0.3s ease;
    }
    .nav-btn:hover { background: rgba(57,255,20,0.15); color: #39ff14; }

    .zoom-btn {
      transition: all 0.3s ease;
    }
    .zoom-btn:hover { background: rgba(57,255,20,0.15); color: #39ff14; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.25s ease; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .loading-text { animation: pulseGlow 1.5s ease-in-out infinite; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #loading-overlay.hidden { opacity: 0; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #39ff14;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #viewer-container {
      cursor: grab;
      overflow: hidden;
    }
    #viewer-container.grabbing { cursor: grabbing; }
    #viewer-container.zoomed-out { cursor: default; }

    #main-image {
      transform-origin: 0 0;
      transition: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Right TOC Sidebar */
    #sidebar {
      position: fixed;
      top: 3.5rem;
      right: 0;
      height: calc(100vh - 3.5rem);
      z-index: 45;
      transform: translateX(320px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-panel {
      width: 320px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    #sidebar-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #e5e5e5;
      letter-spacing: 0.5px;
    }
    #sidebar-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 12px;
    }
    #sidebar-close:hover {
      background: rgba(57, 255, 20, 0.1);
      border-color: rgba(57, 255, 20, 0.25);
      color: #39ff14;
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      scroll-behavior: smooth;
    }
    #sidebar-list::-webkit-scrollbar {
      width: 3px;
    }
    #sidebar-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #sidebar-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }
    #sidebar-list::-webkit-scrollbar-thumb:hover {
      background: rgba(57, 255, 20, 0.25);
    }

    .sidebar-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
    }
    .sidebar-item.active {
      background: rgba(57, 255, 20, 0.05);
      border-color: rgba(57, 255, 20, 0.2);
    }

    .sidebar-num {
      width: 26px;
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      transition: all 0.2s ease;
    }
    .sidebar-item.active .sidebar-num,
    .sidebar-item:hover .sidebar-num {
      background: rgba(57, 255, 20, 0.15);
      color: #39ff14;
    }

    .sidebar-text {
      flex: 1;
      min-width: 0;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 500;
      color: #c5c5c5;
      line-height: 1.4;
      transition: color 0.2s ease;
    }
    .sidebar-item.active .sidebar-title,
    .sidebar-item:hover .sidebar-title {
      color: #e5e5e5;
    }
    .sidebar-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 1px;
      line-height: 1.3;
      transition: color 0.2s ease;
    }
    .sidebar-item.active .sidebar-sub {
      color: rgba(57, 255, 20, 0.45);
    }

    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 44;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #sidebar-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 1024px) {
      #sidebar.open ~ main {
        margin-right: 320px;
      }
    }

    /* Left Detail Floating Ball */
    #detail-ball {
      position: fixed;
      left: -28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 55;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.3s ease,
                  border-color 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      user-select: none;
      -webkit-user-drag: none;
    }
    #detail-ball:hover,
    #detail-ball.hover-in {
      left: 8px;
      border-color: rgba(57, 255, 20, 0.35);
      box-shadow: 0 0 28px rgba(57, 255, 20, 0.1);
    }
    #detail-ball.dragging {
      cursor: grabbing;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.9;
    }
    #detail-ball i {
      color: rgba(255, 255, 255, 0.6);
      font-size: 17px;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    #detail-ball:hover i,
    #detail-ball.hover-in i {
      color: #39ff14;
    }
    #detail-ball .ball-page {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 9px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    #detail-ball:hover .ball-page,
    #detail-ball.hover-in .ball-page {
      border-color: rgba(57, 255, 20, 0.4);
      color: #39ff14;
    }

    /* Detail Card */
    #detail-card {
      position: fixed;
      left: 18px;
      top: 50%;
      transform: translateY(-50%) scale(0.85);
      z-index: 54;
      width: calc(37.5vw - 8px);
      min-width: 420px;
      max-width: 680px;
      max-height: 78vh;
      background: rgba(14, 14, 14, 0.55);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease,
                  transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }
    #detail-card.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) scale(1);
    }
    #detail-card.hidden-card {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(0.85);
    }

    #detail-card-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
    }
    #detail-card-header:active {
      cursor: grabbing;
    }
    #detail-card-header .page-badge {
      font-size: 11px;
      font-weight: 600;
      color: #39ff14;
      background: rgba(57, 255, 20, 0.08);
      padding: 3px 10px;
      border-radius: 20px;
    }
    #detail-card-close {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 10px;
    }
    #detail-card-close:hover {
      background: rgba(57, 255, 20, 0.1);
      border-color: rgba(57, 255, 20, 0.3);
      color: #39ff14;
    }

    #detail-card-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
    }
    #detail-card-body::-webkit-scrollbar {
      width: 2px;
    }
    #detail-card-body::-webkit-scrollbar-track {
      background: transparent;
    }
    #detail-card-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
    }
    #detail-card-body h4 {
      font-size: 16px;
      font-weight: 600;
      color: #e5e5e5;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    #detail-card-body .detail-divider {
      width: 40px;
      height: 2px;
      background: #39ff14;
      opacity: 0.4;
      border-radius: 1px;
      margin-bottom: 14px;
    }
    #detail-card-body p {
      font-size: 13px;
      line-height: 1.85;
      color: rgba(255, 255, 255, 0.5);
    }
    #detail-card-body .detail-label {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: rgba(57, 255, 20, 0.55);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 12px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/60 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="text-white/60 hover:text-white transition flex items-center gap-2 text-sm">
        <i class="fa-solid fa-arrow-left"></i> 返回主页
      </a>
      <span class="text-white/80 font-semibold text-sm">彭一泓 · 作品集</span>
      <div class="flex items-center gap-3">
        <span class="text-white/30 text-xs" id="zoom-indicator">100%</span>
        <span class="text-white/30 text-xs" id="page-indicator">1 / 52</span>
        <button onclick="toggleSidebar()" class="text-white/60 hover:text-[#39ff14] transition text-sm px-2 py-1 rounded border border-white/10 hover:border-[#39ff14]/30" title="目录">
          <i class="fa-solid fa-list-ul mr-1"></i>目录
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Right TOC Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-panel">
      <div id="sidebar-header">
        <h3>作品集目录</h3>
        <button id="sidebar-close" onclick="closeSidebar()" title="关闭">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="sidebar-list"></div>
    </div>
  </aside>

  <!-- Left Detail Ball -->
  <div id="detail-ball" title="查看详情">

    <div class="ball-page" id="ball-page-num">1</div>

  <!-- Left Detail Card -->
  <div id="detail-card">
    <div id="detail-card-header">
      <span class="page-badge" id="detail-badge">第 1 页</span>
      <button id="detail-card-close" onclick="toggleDetailCard()" title="关闭">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="detail-card-body"></div>
  </div>

  <!-- Main Viewer -->
  <main class="flex-1 pt-14 pb-28 flex items-center justify-center p-4">
    <div class="relative w-full h-full flex items-center justify-center" style="min-height: calc(100vh - 14rem);">

      <!-- Navigation buttons -->
      <button onclick="navigate(-1)" class="nav-btn absolute left-2 top-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-black/50 border border-white/10 flex items-center justify-center text-white/70 text-xl">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button onclick="navigate(1)" class="nav-btn absolute right-2 top-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-black/50 border border-white/10 flex items-center justify-center text-white/70 text-xl">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <!-- Zoom controls -->
      <div class="absolute right-4 top-4 z-20 flex flex-col gap-1">
        <button onclick="zoomIn()" class="zoom-btn w-9 h-9 rounded-lg bg-black/50 border border-white/10 flex items-center justify-center text-white/60 text-sm" title="放大">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="zoomOut()" class="zoom-btn w-9 h-9 rounded-lg bg-black/50 border border-white/10 flex items-center justify-center text-white/60 text-sm" title="缩小">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button onclick="resetZoom()" class="zoom-btn w-9 h-9 rounded-lg bg-black/50 border border-white/10 flex items-center justify-center text-white/60 text-sm" title="重置">
          <i class="fa-solid fa-arrows-to-dot"></i>
        </button>
      </div>

      <!-- Viewport -->
      <div id="viewer-container" class="zoomed-out w-full h-full flex items-center justify-center" style="position:relative;">
        <img id="main-image" src="portfolio-images/1.webp" alt="作品集" class="fade-in rounded-lg" style="box-shadow: 0 0 60px rgba(57,255,20,0.06);">
        <div id="loading-overlay" class="hidden">
          <div class="spinner mb-3"></div>
          <p class="loading-text text-[#39ff14]/80 text-sm">还在加载，请耐心等待…</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Thumbnail Strip -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 bg-black/70 backdrop-blur-md border-t border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-2 overflow-x-auto" id="thumbnail-strip">
    </div>
  </footer>

    function clampZoom(z) { return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z)); }

    function applyTransform() {
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      container.classList.toggle('zoomed-out', zoom <= 1);

    function zoomIn() {
      zoomAtPoint(zoom + ZOOM_STEP, container.clientWidth / 2, container.clientHeight / 2);
    }

    function zoomOut() {
      zoomAtPoint(zoom - ZOOM_STEP, container.clientWidth / 2, container.clientHeight / 2);
    }

    function zoomAtPoint(newZoom, cx, cy) {
      const oldZoom = zoom;
      newZoom = clampZoom(newZoom);
      if (newZoom === oldZoom) return;

      // Zoom toward cursor position
      const ratio = newZoom / oldZoom;
      panX = cx - ratio * (cx - panX);
      panY = cy - ratio * (cy - panY);
      zoom = newZoom;
      applyTransform();

      const cy = e.clientY - rect.top;

      }
    });

    container.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = dist / lastPinchDist;
        const newZoom = clampZoom(pinchZoomStart * scale);
        const cx = parseFloat(container.getAttribute('data-pinch-cx')) || container.clientWidth / 2;
        const cy = parseFloat(container.getAttribute('data-pinch-cy')) || container.clientHeight / 2;
        const ratio = newZoom / zoom;
        panX = cx - ratio * (cx - panX);
        panY = cy - ratio * (cy - panY);
        zoom = newZoom;
        applyTransform();
        updateZoomUI();
      }
    }, { passive: false });

    // Navigation
    function preload(i) {
      if (i < 0 || i >= TOTAL || preloaded.has(i)) return;
      preloaded.add(i);
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = `portfolio-images/${i + 1}.webp`;
      document.head.appendChild(link);
    }

    function navigate(dir) {
      const next = (current + dir + TOTAL) % TOTAL;
      goTo(next);
      preload(next + dir);
    }

    const loadingOverlay = document.getElementById('loading-overlay');
    let loadTimeout;

    function showLoading() {
      clearTimeout(loadTimeout);
      loadTimeout = setTimeout(() => {
        loadingOverlay.classList.remove('hidden');
      }, 200);
    }

    function hideLoading() {
      clearTimeout(loadTimeout);
      loadingOverlay.classList.add('hidden');
    }

    function goTo(n) {
      current = n;
      resetZoom();
      showLoading();
      img.classList.remove('fade-in');
      void img.offsetWidth;
      img.src = `portfolio-images/${n + 1}.webp`;
      document.getElementById('page-indicator').textContent = `${n + 1} / ${TOTAL}`;
      updateThumbs();
      syncSidebarActive();
      updateDetailCardContent();
      document.getElementById('ball-page-num').textContent = n + 1;
      preload(n - 1);
      preload(n + 1);
    }

    img.addEventListener('load', () => {
      hideLoading();
      img.classList.add('fade-in');
    });

    img.addEventListener('error', () => {
      hideLoading();
      loadingOverlay.innerHTML = '<p class=\"loading-text text-red-400 text-sm\">加载失败，请重试</p>';
      loadingOverlay.classList.remove('hidden');
    });

    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === current);
        if (i === current) {
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
    }

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'Escape') {
        if (detailCardOpen) { closeDetailCard(); return; }
        if (sidebarOpen) { closeSidebar(); return; }
        resetZoom();
      }
    });

    // Touch swipe (single finger for page turn)
    let touchStartX = 0;
    container.addEventListener('touchstart', e => {
      if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    });
    container.addEventListener('touchend', e => {
      if (e.touches.length === 0) {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 60 && zoom <= 1) navigate(diff > 0 ? 1 : -1);
      }
    });

    // Build thumbnails
    const strip = document.getElementById('thumbnail-strip');
    for (let i = 0; i < TOTAL; i++) {
      const img = document.createElement('img');
      img.src = `portfolio-images/thumb-${i + 1}.webp`;
      img.loading = 'lazy';
      img.className = `thumb w-12 h-16 object-cover rounded cursor-pointer flex-shrink-0 ${i === 0 ? 'active' : ''}`;
      img.onclick = () => goTo(i);
      strip.appendChild(img);
    }
  </script>
</body>
</html>
