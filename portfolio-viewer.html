<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 — 彭一泓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preload" as="image" href="portfolio-images/1.webp">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #e5e5e5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    .thumb {
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .thumb:hover { border-color: #39ff14; transform: translateY(-2px); }
    .thumb.active { border-color: #39ff14; box-shadow: 0 0 12px rgba(57,255,20,0.3); }

    .nav-btn {
      transition: all 0.3s ease;
    }
    .nav-btn:hover { background: rgba(57,255,20,0.15); color: #39ff14; }

    .zoom-btn {
      transition: all 0.3s ease;
    }
    .zoom-btn:hover { background: rgba(57,255,20,0.15); color: #39ff14; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.25s ease; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .loading-text { animation: pulseGlow 1.5s ease-in-out infinite; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #loading-overlay.hidden { opacity: 0; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #39ff14;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #viewer-container {
      cursor: grab;
      overflow: hidden;
    }
    #viewer-container.grabbing { cursor: grabbing; }
    #viewer-container.zoomed-out { cursor: default; }

    #main-image {
      transform-origin: 0 0;
      transition: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Sidebar */
    #sidebar {
      position: fixed;
      top: 3.5rem;
      right: 0;
      height: calc(100vh - 3.5rem);
      z-index: 45;
      transform: translateX(320px); /* hides 320px panel, shows 36px handle */
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
    }
    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-panel {
      width: 320px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-handle {
      width: 36px;
      min-width: 36px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-right: none;
      border-radius: 10px 0 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
      height: 64px;
      box-shadow: -2px 0 16px rgba(0, 0, 0, 0.5);
    }
    #sidebar-handle:hover {
      background: rgba(57, 255, 20, 0.12);
      border-color: rgba(57, 255, 20, 0.4);
      box-shadow: -2px 0 20px rgba(57, 255, 20, 0.08);
    }
    #sidebar-handle i {
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar-handle span {
      writing-mode: vertical-rl;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 2px;
      transition: color 0.3s ease;
    }
    #sidebar.open #sidebar-handle i {
      transform: rotate(180deg);
    }
    #sidebar-handle:hover i,
    #sidebar-handle:hover span {
      color: #39ff14;
    }

    #sidebar-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sidebar-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #e5e5e5;
      letter-spacing: 0.5px;
    }
    #sidebar-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 12px;
    }
    #sidebar-close:hover {
      background: rgba(57, 255, 20, 0.1);
      border-color: rgba(57, 255, 20, 0.25);
      color: #39ff14;
    }

    #sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      scroll-behavior: smooth;
    }
    #sidebar-list::-webkit-scrollbar {
      width: 3px;
    }
    #sidebar-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #sidebar-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }
    #sidebar-list::-webkit-scrollbar-thumb:hover {
      background: rgba(57, 255, 20, 0.25);
    }

    .sidebar-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.05);
    }
    .sidebar-item.active {
      background: rgba(57, 255, 20, 0.05);
      border-color: rgba(57, 255, 20, 0.2);
    }

    .sidebar-num {
      width: 26px;
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      transition: all 0.2s ease;
    }
    .sidebar-item.active .sidebar-num,
    .sidebar-item:hover .sidebar-num {
      background: rgba(57, 255, 20, 0.15);
      color: #39ff14;
    }

    .sidebar-text {
      flex: 1;
      min-width: 0;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 500;
      color: #c5c5c5;
      line-height: 1.4;
      transition: color 0.2s ease;
    }
    .sidebar-item.active .sidebar-title,
    .sidebar-item:hover .sidebar-title {
      color: #e5e5e5;
    }
    .sidebar-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 1px;
      line-height: 1.3;
      transition: color 0.2s ease;
    }
    .sidebar-item.active .sidebar-sub {
      color: rgba(57, 255, 20, 0.45);
    }

    /* Overlay */
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 44;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #sidebar-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Adjust viewer when sidebar open */
    @media (min-width: 1024px) {
      #sidebar.open ~ main {
        margin-right: 320px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/60 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="text-white/60 hover:text-white transition flex items-center gap-2 text-sm">
        <i class="fa-solid fa-arrow-left"></i> 返回主页
      </a>
      <span class="text-white/80 font-semibold text-sm">彭一泓 · 作品集</span>
      <div class="flex items-center gap-3">
        <span class="text-white/30 text-xs" id="zoom-indicator">100%</span>
        <span class="text-white/30 text-xs" id="page-indicator">1 / 31</span>
        <button onclick="toggleSidebar()" class="text-white/60 hover:text-[#39ff14] transition text-sm px-2 py-1 rounded border border-white/10 hover:border-[#39ff14]/30" title="目录">
          <i class="fa-solid fa-list-ul mr-1"></i>目录
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-handle" onclick="toggleSidebar()" title="展开目录">
      <i class="fa-solid fa-chevron-left"></i>
      <span>目录</span>
    </div>
    <div id="sidebar-panel">
      <div id="sidebar-header">
        <h3>作品集目录</h3>
        <button id="sidebar-close" onclick="closeSidebar()" title="关闭">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="sidebar-list"></div>
    </div>
  </aside>

  <!-- Main Viewer -->
  <main class="flex-1 pt-14 pb-28 flex items-center justify-center p-4">
    <div class="relative w-full h-full flex items-center justify-center" style="min-height: calc(100vh - 14rem);">

      <!-- Navigation buttons -->
      <button onclick="navigate(-1)" class="nav-btn absolute left-2 top-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-black/50 border border-white/10 flex items-center justify-center text-white/70 text-xl">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button onclick="navigate(1)" class="nav-btn absolute right-2 top-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-black/50 border border-white/10 flex items-center justify-center text-white/70 text-xl">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <!-- Zoom controls -->
      <div class="absolute right-4 top-4 z-20 flex flex-col gap-1">
        <button onclick="zoomIn()" class="zoom-btn w-9 h-9 rounded-lg bg-black/50 border border-white/10 flex items-center justify-center text-white/60 text-sm" title="放大">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="zoomOut()" class="zoom-btn w-9 h-9 rounded-lg bg-black/50 border border-white/10 flex items-center justify-center text-white/60 text-sm" title="缩小">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button onclick="resetZoom()" class="zoom-btn w-9 h-9 rounded-lg bg-black/50 border border-white/10 flex items-center justify-center text-white/60 text-sm" title="重置">
          <i class="fa-solid fa-arrows-to-dot"></i>
        </button>
      </div>

      <!-- Viewport -->
      <div id="viewer-container" class="zoomed-out w-full h-full flex items-center justify-center" style="position:relative;">
        <img id="main-image" src="portfolio-images/1.webp" alt="作品集" class="fade-in rounded-lg" style="box-shadow: 0 0 60px rgba(57,255,20,0.06);">
        <div id="loading-overlay" class="hidden">
          <div class="spinner mb-3"></div>
          <p class="loading-text text-[#39ff14]/80 text-sm">还在加载，请耐心等待…</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Thumbnail Strip -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 bg-black/70 backdrop-blur-md border-t border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-2 overflow-x-auto" id="thumbnail-strip">
    </div>
  </footer>

  <script>
    const TOTAL = 31;
    let current = 0;

    // Sidebar page descriptions
    const pageInfo = [
      { title: '封面', sub: '彭一泓 · 产品设计作品集' },
      { title: '个人简历', sub: '教育背景与经历' },
      { title: '作品集目录', sub: '项目总览与导航' },
      // 项目一：AI 智能服务设计
      { title: 'AI 智能服务设计', sub: '项目概述 · 基于大语言模型的智能服务平台' },
      { title: '服务规划与架构', sub: 'AI 服务蓝图与技术路线设计' },
      { title: '市场趋势分析', sub: '行业现状与AI服务市场机遇' },
      { title: '竞品分析', sub: '主流AI服务产品对比与差异化定位' },
      { title: '用户研究与画像', sub: '目标用户群体分析与核心需求提炼' },
      { title: '用户体验地图', sub: '端到端用户旅程与服务触点设计' },
      { title: '设计概念与策略', sub: '核心设计理念与服务体验策略' },
      { title: '界面视觉设计', sub: '主要功能界面与交互原型' },
      { title: '设计细节与规范', sub: '组件规范、动效与视觉一致性' },
      // 项目二
      { title: '智能系统设计', sub: '项目概述 · 数据驱动的智能决策系统' },
      { title: '需求分析与定义', sub: '业务需求拆解与功能优先级排序' },
      { title: '系统架构设计', sub: '产品信息架构与技术方案' },
      { title: '用户流程设计', sub: '核心操作流程与交互逻辑' },
      { title: '数据可视化设计', sub: '仪表盘与数据分析界面' },
      { title: '原型设计与验证', sub: '低保真到高保真原型迭代' },
      { title: '界面视觉设计', sub: '完整UI界面与品牌视觉' },
      { title: '设计交付与规范', sub: '设计标注、组件库与开发对接' },
      // 项目三
      { title: '移动应用设计', sub: '项目概述 · 面向年轻用户的生活方式App' },
      { title: '用户调研与洞察', sub: '问卷调研、用户访谈与行为分析' },
      { title: '功能定义与架构', sub: '信息架构与功能模块设计' },
      { title: '交互流程设计', sub: '核心场景交互流程与手势设计' },
      { title: '视觉风格探索', sub: '品牌视觉方向与情绪板' },
      { title: '界面视觉设计', sub: '主要页面UI设计与视觉规范' },
      { title: '高保真原型', sub: '可交互原型与动效设计' },
      { title: '设计验证与优化', sub: '可用性测试与迭代优化' },
      // 项目四
      { title: '服务体验创新', sub: '项目概述 · 线上线下融合的服务体验重塑' },
      { title: '服务蓝图与触点', sub: '全链路服务触点梳理与设计机会' },
      { title: '设计方案呈现', sub: '最终方案展示与设计价值总结' },
    ];

    // Build sidebar list
    const sidebarList = document.getElementById('sidebar-list');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    let sidebarOpen = false;

    function buildSidebar() {
      sidebarList.innerHTML = '';
      pageInfo.forEach((info, i) => {
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (i === current ? ' active' : '');
        item.setAttribute('data-page', i);
        item.onclick = () => { goTo(i); if (window.innerWidth < 1024) closeSidebar(); };
        item.innerHTML = `
          <div class="sidebar-num">${i + 1}</div>
          <div class="sidebar-text">
            <div class="sidebar-title">${info.title}</div>
            <div class="sidebar-sub">${info.sub}</div>
          </div>
        `;
        sidebarList.appendChild(item);
      });
    }

    function openSidebar() {
      sidebar.classList.add('open');
      if (window.innerWidth < 1024) sidebarOverlay.classList.add('visible');
      sidebarOpen = true;
      scrollSidebarToCurrent();
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('visible');
      sidebarOpen = false;
    }

    function toggleSidebar() {
      sidebarOpen ? closeSidebar() : openSidebar();
    }

    function syncSidebarActive() {
      document.querySelectorAll('.sidebar-item').forEach((item, i) => {
        item.classList.toggle('active', i === current);
      });
      scrollSidebarToCurrent();
    }

    function scrollSidebarToCurrent() {
      const active = sidebarList.querySelector('.sidebar-item.active');
      if (active) {
        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Keyboard shortcut: S to toggle sidebar
    document.addEventListener('keydown', e => {
      if (e.key === 's' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement === document.body) {
        toggleSidebar();
      }
    });

    buildSidebar();
    const preloaded = new Set([0]);

    // Zoom state
    let zoom = 1;
    const MIN_ZOOM = 0.3;
    const MAX_ZOOM = 5;
    const ZOOM_STEP = 0.15;
    let panX = 0, panY = 0;

    // Pan state
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let panStartX = 0, panStartY = 0;

    const container = document.getElementById('viewer-container');
    const img = document.getElementById('main-image');

    function clampZoom(z) { return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z)); }

    function applyTransform() {
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      container.classList.toggle('zoomed-out', zoom <= 1);
    }

    function updateZoomUI() {
      document.getElementById('zoom-indicator').textContent = Math.round(zoom * 100) + '%';
    }

    function resetZoom() {
      zoom = 1;
      panX = 0; panY = 0;
      applyTransform();
      updateZoomUI();
    }

    function zoomIn() {
      zoomAtPoint(zoom + ZOOM_STEP, container.clientWidth / 2, container.clientHeight / 2);
    }

    function zoomOut() {
      zoomAtPoint(zoom - ZOOM_STEP, container.clientWidth / 2, container.clientHeight / 2);
    }

    function zoomAtPoint(newZoom, cx, cy) {
      const oldZoom = zoom;
      newZoom = clampZoom(newZoom);
      if (newZoom === oldZoom) return;

      // Zoom toward cursor position
      const ratio = newZoom / oldZoom;
      panX = cx - ratio * (cx - panX);
      panY = cy - ratio * (cy - panY);
      zoom = newZoom;
      applyTransform();
      updateZoomUI();
    }

    // Mouse wheel zoom
    container.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) return; // browser zoom
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
      zoomAtPoint(zoom + delta, cx, cy);
    }, { passive: false });

    // Pan with drag
    container.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      isDragging = true;
      container.classList.add('grabbing');
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      panStartX = panX;
      panStartY = panY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = panStartX + (e.clientX - dragStartX);
      panY = panStartY + (e.clientY - dragStartY);
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      container.classList.remove('grabbing');
    });

    // Double-click to reset zoom
    container.addEventListener('dblclick', e => {
      e.preventDefault();
      resetZoom();
    });

    // Touch pinch zoom
    let lastPinchDist = 0;
    let pinchZoomStart = 1;
    let pinchPanX = 0, pinchPanY = 0;

    container.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchZoomStart = zoom;
        pinchPanX = panX;
        pinchPanY = panY;
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - container.getBoundingClientRect().left;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - container.getBoundingClientRect().top;
        container.setAttribute('data-pinch-cx', cx);
        container.setAttribute('data-pinch-cy', cy);
      }
    });

    container.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = dist / lastPinchDist;
        const newZoom = clampZoom(pinchZoomStart * scale);
        const cx = parseFloat(container.getAttribute('data-pinch-cx')) || container.clientWidth / 2;
        const cy = parseFloat(container.getAttribute('data-pinch-cy')) || container.clientHeight / 2;
        const ratio = newZoom / zoom;
        panX = cx - ratio * (cx - panX);
        panY = cy - ratio * (cy - panY);
        zoom = newZoom;
        applyTransform();
        updateZoomUI();
      }
    }, { passive: false });

    // Navigation
    function preload(i) {
      if (i < 0 || i >= TOTAL || preloaded.has(i)) return;
      preloaded.add(i);
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = `portfolio-images/${i + 1}.webp`;
      document.head.appendChild(link);
    }

    function navigate(dir) {
      const next = (current + dir + TOTAL) % TOTAL;
      goTo(next);
      preload(next + dir);
    }

    const loadingOverlay = document.getElementById('loading-overlay');
    let loadTimeout;

    function showLoading() {
      clearTimeout(loadTimeout);
      loadTimeout = setTimeout(() => {
        loadingOverlay.classList.remove('hidden');
      }, 200);
    }

    function hideLoading() {
      clearTimeout(loadTimeout);
      loadingOverlay.classList.add('hidden');
    }

    function goTo(n) {
      current = n;
      resetZoom();
      showLoading();
      img.classList.remove('fade-in');
      void img.offsetWidth;
      img.src = `portfolio-images/${n + 1}.webp`;
      document.getElementById('page-indicator').textContent = `${n + 1} / ${TOTAL}`;
      updateThumbs();
      syncSidebarActive();
      preload(n - 1);
      preload(n + 1);
    }

    img.addEventListener('load', () => {
      hideLoading();
      img.classList.add('fade-in');
    });

    img.addEventListener('error', () => {
      hideLoading();
      loadingOverlay.innerHTML = '<p class=\"loading-text text-red-400 text-sm\">加载失败，请重试</p>';
      loadingOverlay.classList.remove('hidden');
    });

    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === current);
        if (i === current) {
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
    }

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'Escape') resetZoom();
    });

    // Touch swipe (single finger for page turn)
    let touchStartX = 0;
    container.addEventListener('touchstart', e => {
      if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    });
    container.addEventListener('touchend', e => {
      if (e.touches.length === 0) {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 60 && zoom <= 1) navigate(diff > 0 ? 1 : -1);
      }
    });

    // Build thumbnails
    const strip = document.getElementById('thumbnail-strip');
    for (let i = 0; i < TOTAL; i++) {
      const img = document.createElement('img');
      img.src = `portfolio-images/thumb-${i + 1}.webp`;
      img.loading = 'lazy';
      img.className = `thumb w-12 h-16 object-cover rounded cursor-pointer flex-shrink-0 ${i === 0 ? 'active' : ''}`;
      img.onclick = () => goTo(i);
      strip.appendChild(img);
    }
  </script>
</body>
</html>
